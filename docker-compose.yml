# ──────────────────────────────────────────────────────────
# LinyaShare - Docker Compose (Production)
# ──────────────────────────────────────────────────────────
# Usage:
#   docker compose up -d
#   docker compose logs -f
#   docker compose down
# ──────────────────────────────────────────────────────────

services:
  linyashare:
    build:
      context: .
      dockerfile: Dockerfile
      # Build-Arg muss zum Laufzeit-DATABASE_PROVIDER passen
      # (er bestimmt, welche Prisma-Engine in das Image gebaut wird).
      #   sqlite (Standard) | mysql | postgres
      args:
        DATABASE_PROVIDER: ${DATABASE_PROVIDER:-sqlite}
    container_name: linyashare
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      # ── Database ──
      # DATABASE_PROVIDER: sqlite (Standard) | mysql | postgres
      - DATABASE_PROVIDER=${DATABASE_PROVIDER:-sqlite}
      # Leer lassen für die eingebaute SQLite-Datenbank.
      # Externe Beispiele:
      #   MySQL:       mysql://user:password@dbhost:3306/linyashare
      #   PostgreSQL:  postgresql://user:password@dbhost:5432/linyashare
      - DATABASE_URL=${DATABASE_URL:-}
      
      # ── Authentication ──
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-change-me-to-a-random-secret}
      - NEXTAUTH_URL=${NEXTAUTH_URL:-http://localhost:3000}
      
      # ── App Configuration ──
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-http://localhost:3000}
      - UPLOAD_DIR=/app/data/uploads
      - IMPORT_DIR=/app/data/import
      
      # ── Node ──
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
    volumes:
      # Persist data in local project directory
      - type: bind
        source: ./prisma
        target: /app/prisma
      - type: bind
        source: ./data
        target: /app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/setup"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

